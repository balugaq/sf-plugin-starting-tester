<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件兼容性测试控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #11151c; color: #e6e6e6;
         max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; color: #9ab; }
  .card { background: #1a1f29; border: 1px solid #2c3442; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-size: .82rem; color: #8fa; margin: .7rem 0 .25rem; }
  input, select { width: 100%; padding: .45rem .6rem; border-radius: 6px; border: 1px solid #3a4353;
                  background: #11151c; color: #e6e6e6; font-size: .9rem; }
  .row { display: flex; gap: .8rem; }
  .row > div { flex: 1; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px;
           padding: .55rem 1.2rem; font-size: .95rem; cursor: pointer; margin-top: 1rem; }
  button:hover { background: #3d7cf0; }
  button:disabled { background: #445; cursor: wait; }
  .hint { font-size: .78rem; color: #778; margin-top: .3rem; }
  .token-note { background: #2a2313; border: 1px solid #66551f; border-radius: 6px;
                padding: .5rem .8rem; font-size: .8rem; color: #d9c26a; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #262d3a; }
  th { color: #8fa; font-weight: 500; }
  .badge { display: inline-block; border-radius: 4px; padding: .1rem .5rem; font-size: .78rem; color: #fff; margin: 1px; }
  .ok { background: #0a7d32; } .fail { background: #c62828; }
  .run { background: #b58a2c; } .queue { background: #556; }
  a { color: #6db3f2; text-decoration: none; }
  .msg { font-size: .85rem; margin-top: .8rem; color: #9ab; white-space: pre-wrap; }
  .err { color: #f2a09e; }
</style>
</head>
<body>
<h1>🧪 插件兼容性测试控制台</h1>
<p class="hint">选择附属插件与 MC 版本，触发 GitHub Actions 开服测试，结果直接显示在下方。仅覆盖启动阶段判定。</p>

<div class="card">
  <div class="token-note">首次使用需要个人访问令牌（fine-grained PAT）：仅勾选本仓库的 <b>Actions: Read and write</b> 权限，
    在 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">GitHub Token 设置</a>生成。
    Token 只保存在你浏览器的 localStorage，不经过任何第三方。</div>
  <label>GitHub Token</label>
  <input id="token" type="password" placeholder="github_pat_...">
  <div class="row">
    <div>
      <label>仓库（owner/repo，留空自动识别）</label>
      <input id="repo" placeholder="自动">
    </div>
    <div>
      <label>分支</label>
      <input id="ref" value="main">
    </div>
  </div>
</div>

<div class="card">
  <h2 style="margin-top:0">新建测试</h2>
  <div class="row">
    <div>
      <label>附属插件 slug *</label>
      <input id="slug" placeholder="如 ExoticGarden">
    </div>
    <div>
      <label>版本（留空 = 最新）</label>
      <input id="ver" placeholder="留空">
    </div>
  </div>
  <div class="row">
    <div>
      <label>MC 版本（逗号分隔）*</label>
      <input id="mcvers" value="1.21.4,1.20.4">
    </div>
    <div>
      <label>平台</label>
      <select id="platform">
        <option>paper</option><option>purpur</option><option>folia</option>
      </select>
    </div>
  </div>
  <label>额外安装的 softdepend（逗号分隔，GuizhanLibPlugin 自动装）</label>
  <input id="softdep" placeholder="留空">
  <label>自备 jar 直链（逗号分隔，可选）</label>
  <input id="extrajars" placeholder="留空">
  <button id="runBtn" onclick="trigger()">▶ 触发测试</button>
  <div id="msg" class="msg"></div>
</div>

<div class="card">
  <h2 style="margin-top:0">测试记录 <button style="float:right;margin:0;padding:.2rem .7rem;font-size:.8rem" onclick="loadRuns()">刷新</button></h2>
  <table>
    <thead><tr><th>时间</th><th>插件</th><th>各版本结果</th><th>状态</th><th>链接</th></tr></thead>
    <tbody id="runs"><tr><td colspan="5" class="hint">加载中…</td></tr></tbody>
  </table>
</div>

<script>
const API = 'https://api.github.com';
const WF = 'test-compatibility.yml';
const $ = id => document.getElementById(id);
$('token').value = localStorage.getItem('gh_pat') || '';
$('repo').placeholder = guessRepo() || 'owner/repo';

function guessRepo() {
  const p = location.pathname.split('/').filter(Boolean);
  // 项目 Pages: /{repo}/；本地: 手填
  return p.length >= 2 ? p.slice(0, 2).join('/') : (p.length === 1 ? p[0] : '');
}

function repoPath() {
  const r = $('repo').value.trim() || guessRepo();
  if (!r || !r.includes('/')) throw new Error('仓库标识无效，请填 owner/repo');
  return r;
}

function headers() {
  const t = $('token').value.trim();
  if (!t) throw new Error('请先填 GitHub Token');
  localStorage.setItem('gh_pat', t);
  return { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json' };
}

async function trigger() {
  const msg = $('msg'), btn = $('runBtn');
  try {
    btn.disabled = true; msg.textContent = '提交中…'; msg.className = 'msg';
    const inputs = {
      plugin_slug: $('slug').value.trim(),
      plugin_version: $('ver').value.trim(),
      minecraft_versions: $('mcvers').value.trim(),
      platform: $('platform').value,
      softdepend_plugins: $('softdep').value.trim(),
      extra_jars: $('extrajars').value.trim(),
    };
    if (!inputs.plugin_slug) throw new Error('请填插件 slug');
    if (!inputs.minecraft_versions) throw new Error('请填 MC 版本');
    const res = await fetch(`${API}/repos/${repoPath()}/actions/workflows/${WF}/dispatches`, {
      method: 'POST', headers: headers(), body: JSON.stringify({ ref: $('ref').value.trim() || 'main', inputs })
    });
    if (res.status !== 204) throw new Error(`触发失败: HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
    msg.textContent = '✅ 已触发，等待 Actions 接单（下方列表 15 秒后自动刷新）';
    setTimeout(loadRuns, 15000);
  } catch (e) {
    msg.textContent = e.message; msg.className = 'msg err';
  } finally { btn.disabled = false; }
}

const badge = (cls, text) => `<span class="badge ${cls}">${text}</span>`;

function renderJobs(jobs) {
  return jobs.jobs.map(j => {
    const mc = j.name.replace(/^MC /, '');
    const cls = j.conclusion === 'success' ? 'ok' : j.conclusion === 'failure' ? 'fail' : 'run';
    return badge(cls, `${mc} ${j.conclusion === 'success' ? '✔' : j.conclusion === 'failure' ? '✘' : '…'}`);
  }).join(' ') || '<span class="hint">排队中</span>';
}

async function loadRuns() {
  const tbody = $('runs');
  try {
    const res = await fetch(`${API}/repos/${repoPath()}/actions/workflows/${WF}/runs?per_page=15`, { headers: headers() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const runs = (await res.json()).workflow_runs;
    tbody.innerHTML = '';
    for (const r of runs) {
      const tr = document.createElement('tr');
      let jobs = '<span class="hint">-</span>';
      if (r.status !== 'completed' || r.run_number > (runs.length > 1 ? 2 : 1)) {
        try {
          const jr = await fetch(`${API}/repos/${repoPath()}/actions/runs/${r.id}/jobs?per_page=30`, { headers: headers() });
          if (jr.ok) jobs = renderJobs(await jr.json());
        } catch (_) {}
      }
      tr.innerHTML = `
        <td>${new Date(r.created_at).toLocaleString('zh-CN', { hour12: false })}</td>
        <td>${r.display_title || '-'}</td>
        <td>${jobs}</td>
        <td>${r.status === 'completed'
              ? badge(r.conclusion === 'success' ? 'ok' : 'fail', r.conclusion === 'success' ? '完成' : '失败')
              : badge('run', r.status === 'queued' ? '排队' : '运行中')}</td>
        <td><a href="${r.html_url}" target="_blank">日志</a></td>`;
      tbody.appendChild(tr);
    }
    if (!runs.length) tbody.innerHTML = '<tr><td colspan="5" class="hint">还没有运行记录</td></tr>';
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="err">${e.message}</td></tr>`;
  }
  // 有未完成的 run 时持续轮询
  clearTimeout(loadRuns._t);
  loadRuns._t = setTimeout(loadRuns, 15000);
}

loadRuns();
</script>
</body>
</html>
