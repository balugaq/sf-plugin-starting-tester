<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件兼容性测试控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg-1: #11151c; --bg-2: #1a1f29; --bg-3: #202838;
    --border: #2c3442; --border-strong: #3a4353;
    --text-1: #e6e6e6; --text-2: #9ab; --text-3: #778;
    --accent: #2d6cdf; --accent-hover: #3d7cf0;
    --ok: #0a7d32; --fail: #c62828; --run: #b58a2c;
    --panel: #16202f; --tip-bg: #0d1117;
    --radius: 10px;
  }
  /* ---------- 日间模式：只翻转变量 ---------- */
  body.light {
    color-scheme: light;
    --bg-1: #f4f6f9; --bg-2: #ffffff; --bg-3: #edf1f6;
    --border: #dde3ec; --border-strong: #c3ccd9;
    --text-1: #1c2430; --text-2: #46536a; --text-3: #7d8899;
    --panel: #eef2f7; --tip-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-1); color: var(--text-1);
    max-width: 1080px; margin: 0 auto; padding: 1.2rem 1rem 4rem;
    line-height: 1.5;
  }

  /* ---------- 顶栏 ---------- */
  .topbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
  h1 { font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: .5rem; flex: 1; }
  .topbar .sub { font-size: .78rem; color: var(--text-3); flex: 1 1 100%; margin: 0 0 .6rem; }
  .topbar button.active { background: var(--accent); }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.2rem; margin-bottom: 1rem;
  }
  h2 { font-size: 1rem; margin: 0 0 .8rem; color: var(--text-2); display: flex; align-items: center; gap: .5rem; }
  h2 .step {
    font-size: .7rem; background: rgba(45,108,223,.15); color: #6db3f2;
    border: 1px solid rgba(45,108,223,.35); border-radius: 4px; padding: .05rem .4rem;
  }
  body.light h2 .step { color: var(--accent); }
  h2 .spacer { flex: 1; }

  /* ---------- 表单 ---------- */
  label { display: block; font-size: .78rem; color: #8fa; margin: .55rem 0 .2rem; }
  body.light label { color: var(--text-2); }
  input, select, textarea {
    width: 100%; padding: .42rem .55rem; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--bg-1);
    color: var(--text-1); font-size: .86rem; font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(45,108,223,.5); outline-offset: 0; border-color: var(--accent); }
  .row { display: flex; gap: .8rem; flex-wrap: wrap; }
  .row > div { flex: 1 1 140px; }

  /* ---------- 按钮 ---------- */
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: .48rem 1.1rem; font-size: .88rem; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #445; cursor: wait; }
  button.ghost { background: var(--border); }
  button.ghost:hover { background: var(--border-strong); }
  button.mini { padding: .18rem .6rem; font-size: .76rem; }
  .btn-danger { background: var(--fail); }
  .btn-danger:hover { background: #e03535; }

  /* ---------- helper "?" 徽标 ---------- */
  .helper {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; margin-left: .3rem; flex-shrink: 0;
    border-radius: 50%; border: 1px solid #5a6b85; color: #8fa;
    font-size: .68rem; cursor: pointer; user-select: none; vertical-align: middle;
  }
  a.helper, a.helper:hover { text-decoration: none; }
  body.light .helper { border-color: var(--border-strong); color: var(--text-2); }
  .helper:hover { border-color: var(--accent); color: #6db3f2; }
  .helper .tip {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); z-index: 20;
    width: max-content; max-width: 300px; padding: .5rem .7rem;
    background: var(--tip-bg); border: 1px solid var(--border-strong); border-radius: 6px;
    color: var(--text-2); font-size: .74rem; line-height: 1.5;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); text-align: left; white-space: normal;
  }
  .helper .tip a { color: #6db3f2; }
  .helper:hover .tip { display: block; }

  /* ---------- Token 条 ---------- */
  .token-bar {
    background: #2a2313; border: 1px solid #66551f; border-radius: 8px;
    padding: .5rem .8rem; margin-bottom: 1rem;
  }
  body.light .token-bar { background: #fdf6e0; border-color: #d9c26a; }
  .token-line { display: flex; gap: .6rem; align-items: center; }
  .token-line + .token-line { margin-top: .45rem; }
  .token-line .label { font-size: .8rem; color: #d9c26a; white-space: nowrap; }
  body.light .token-line .label { color: #8a6d1a; }
  .token-line input { flex: 1; background: #1c1a10; border-color: #66551f; }
  body.light .token-line input { background: #fff; border-color: #d9c26a; }
  .token-help { margin-top: .45rem; font-size: .76rem; color: #d9c26a; line-height: 1.45; }
  body.light .token-help { color: #8a6d1a; }
  .token-help[hidden] { display: none; }
  .token-help a, .token-line .tip a { color: #f0d97a; }
  body.light .token-help a, body.light .token-line .tip a { color: var(--accent); }

  /* ---------- 工作区：列表 + 参数 ---------- */
  .workspace { display: grid; grid-template-columns: 1fr 300px; gap: 1rem; align-items: start; }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  /* ---------- 插件列表 ---------- */
  .list-card { padding-bottom: 0; overflow: hidden; } /* sticky bar 贴边需要 */
  .list-toolbar { display: flex; gap: .6rem; margin-bottom: .6rem; }
  .list-toolbar input { flex: 1; }
  #list {
    max-height: min(58vh, 460px); overflow-y: auto;
    overscroll-behavior: contain;
    margin: 0 -1.2rem; padding: 0 1.2rem;
  }
  #list .item {
    display: flex; align-items: flex-start; gap: .6rem;
    padding: .42rem .5rem; border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent; cursor: pointer; transition: background .12s;
  }
  #list .item:hover { background: var(--bg-3); }
  #list .item.selected { background: rgba(45,108,223,.08); border-left-color: var(--accent); }
  #list .item input[type=checkbox] { width: auto; margin-top: .28rem; flex-shrink: 0; cursor: pointer; }
  #list .item .body { flex: 1; min-width: 0; }
  #list .item .name { font-size: .88rem; }
  #list .item .meta {
    color: var(--text-3); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 3px;
  }
  #list .item .meta svg { flex-shrink: 0; opacity: .8; }
  #list mark { background: #2d6cdf55; color: #cfe2ff; border-radius: 2px; padding: 0 1px; }
  body.light #list mark { color: #1c4a8f; }
  #list .conflict-btn {
    padding: .08rem .5rem; font-size: .72rem; background: var(--run);
    margin-left: auto; flex-shrink: 0; white-space: nowrap;
  }
  #list .conflict-btn:hover { background: #d19a32; }
  #list .item .conflict-note { color: var(--run); font-size: .72rem; }

  /* ---------- 排序与翻页 ---------- */
  .list-toolbar select { width: auto; flex-shrink: 0; }
  .pager {
    display: flex; align-items: center; justify-content: center; gap: .7rem;
    padding: .45rem 0 .55rem; font-size: .8rem; color: var(--text-2);
  }
  .pager button { padding: .15rem .7rem; font-size: .78rem; }
  .pager button:disabled { opacity: .45; cursor: default; }
  .pager .pg { min-width: 70px; text-align: center; }

  /* ---------- 贴底栏 ---------- */
  .sticky-bar {
    position: sticky; bottom: 0;
    display: flex; gap: .7rem; align-items: center; flex-wrap: wrap;
    background: var(--panel); border-top: 1px solid var(--accent);
    margin: .6rem -1.2rem 0; padding: .55rem 1.2rem;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .sticky-bar .count { font-size: .84rem; color: var(--text-2); }
  .sticky-bar .spacer { flex: 1; }

  /* ---------- 记录表 ---------- */
  table { width: 100%; border-collapse: collapse; font-size: .85rem; table-layout: fixed; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: #8fa; font-weight: 500; font-size: .78rem; }
  body.light th { color: var(--text-2); }
  td.col-time { width: 150px; color: var(--text-2); font-size: .8rem; }
  td.col-run { width: 70px; color: var(--text-3); }
  td a { margin-left: .5rem; }
  td.col-status .badge { margin-right: .4rem; }

  /* ---------- 徽章 ---------- */
  .badge {
    display: inline-block; border-radius: 4px; padding: .1rem .45rem;
    font-size: .74rem; color: #fff; white-space: nowrap;
  }
  .badge.ok { background: var(--ok); }
  .badge.fail { background: var(--fail); }
  .badge.run { background: var(--run); }
  .badge.queue { background: #556; }
  .badge.partial { background: #c77700; }

  /* ---------- 提示文本 ---------- */
  .hint { font-size: .76rem; color: var(--text-3); margin: .3rem 0 0; }
  .msg { font-size: .84rem; margin-top: .8rem; color: var(--text-2); white-space: pre-wrap; }
  .err { color: #f2a09e; }
  body.light .err { color: #b3261e; }
  a { color: #6db3f2; text-decoration: none; }
  body.light a { color: var(--accent); }
  a:hover { text-decoration: underline; }

  /* ---------- MC 版本多选下拉 ---------- */
  .mcsel { position: relative; }
  .mcsel-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-1); border: 1px solid var(--border-strong);
    color: var(--text-1); padding: .42rem .55rem; font-size: .86rem; text-align: left;
  }
  .mcsel-btn:hover { background: var(--bg-1); border-color: var(--accent); }
  .mcsel-btn .caret { opacity: .6; margin-left: .5rem; }
  .mcsel-panel {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 15;
    background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); padding: .5rem;
  }
  body.light .mcsel-panel { box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .mcsel.open .mcsel-panel { display: block; }
  .mcsel-panel input[type=text] { margin-bottom: .4rem; }
  #mcList { max-height: 260px; overflow-y: auto; }
  #mcList .grp { font-size: .72rem; color: var(--text-3); padding: .3rem .2rem .1rem; }
  #mcList .opt {
    display: flex; align-items: center; gap: .45rem; padding: .18rem .3rem;
    border-radius: 4px; cursor: pointer; font-size: .82rem;
  }
  #mcList .opt:hover { background: var(--bg-3); }
  #mcList .opt input { width: auto; flex-shrink: 0; }
  #mcList mark { background: #2d6cdf55; color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- 弹窗（确认 / 用户协议共用） ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: none; align-items: center; justify-content: center; z-index: 10;
    padding: 1rem;
  }
  body.light .mask { background: rgba(30,40,60,.45); }
  .mask.show { display: flex; }
  .dialog {
    background: var(--bg-2); border: 1px solid var(--accent); border-radius: var(--radius);
    max-width: 680px; width: 100%; max-height: 84vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .dialog .head { padding: 1rem 1.2rem .6rem; border-bottom: 1px solid var(--border); }
  .dialog .head h2 { margin: 0; }
  .dialog .body { padding: .8rem 1.2rem; overflow-y: auto; flex: 1; }
  .dialog .body ul {
    columns: 2; column-gap: 1.2rem;
    font-size: .82rem; padding-left: 1.1rem; margin: .5rem 0;
  }
  .dialog .body li { break-inside: avoid; padding: .1rem 0; }
  .dialog .body .clause { font-size: .84rem; color: var(--text-2); }
  .dialog .body .clause b { color: var(--text-1); }
  .dialog .actions {
    display: flex; gap: .8rem; justify-content: flex-end; align-items: center;
    padding: .8rem 1.2rem; border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .dialog .actions .msg { flex: 1; margin: 0; align-self: center; }
  .ua-check {
    display: flex; flex: 1; align-items: center; gap: .45rem;
    font-size: .8rem; color: var(--text-2); margin: 0; cursor: pointer;
  }
  .ua-check input { width: auto; flex-shrink: 0; }
  .warn {
    background: rgba(197,119,0,.15); border: 1px solid var(--run);
    border-radius: 6px; padding: .5rem .7rem; font-size: .84rem; color: var(--run);
  }
  .ua-only-actions .ua-check, .ua-only-actions #uaBtn { display: none; }
  .ua-only-actions .ua-cancel { background: var(--accent); }
  footer.site { text-align: center; font-size: .8rem; margin: 1.5rem 0 .5rem; }

  /* ---------- 顶部 toast ---------- */
  #toast {
    position: fixed; top: 14px; left: 50%; z-index: 50;
    transform: translateX(-50%) translateY(-10px);
    background: var(--bg-2); border: 1px solid var(--accent); color: var(--text-1);
    padding: .55rem 1.1rem; border-radius: 8px; font-size: .85rem;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: 90vw;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--fail); color: #f2a09e; }
  @media (max-width: 520px) { .dialog .body ul { columns: 1; } }

  /* ---------- 记录表手机端卡片化 ---------- */
  @media (max-width: 600px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: .6rem; padding: .5rem .7rem; background: var(--bg-1); }
    td { border: 0; padding: .2rem 0; width: auto !important; }
    td.col-time { font-size: .78rem; }
  }
</style>
</head>
<body>

<!-- 顶部 toast -->
<div id="toast" role="status"></div>

<!-- 顶栏 -->
<div class="topbar">
  <h1 data-i18n="title"></h1>
  <button class="ghost mini" id="btnDark" onclick="setTheme('dark')" data-i18n="themeDark"></button>
  <button class="ghost mini" id="btnLight" onclick="setTheme('light')" data-i18n="themeLight"></button>
  <button class="ghost mini" id="btnLang" onclick="toggleLang()"></button>
</div>
<p class="sub" data-i18n="sub"></p>

<!-- Token 条 -->
<div class="token-bar">
  <div class="token-line">
    <span class="label" data-i18n="ghToken"></span>
    <input id="token" type="password" data-i18n-ph="ghTokenPh">
    <button class="ghost mini" onclick="document.getElementById('tokenHelp').hidden ^= 1">?</button>
  </div>
  <div class="token-line">
    <span class="label" data-i18n="gzToken"></span>
    <input id="gzToken" type="password" data-i18n-ph="gzTokenPh">
    <a class="helper" href="https://resources.guizhanss.com/settings/tokens" target="_blank" rel="noopener">?
      <span class="tip" data-i18n-html="gzTipHtml"></span>
    </a>
  </div>
  <div class="token-help" id="tokenHelp" hidden data-i18n-html="tokenHelpHtml"></div>
</div>

<!-- 工作区 -->
<div class="workspace">

  <!-- 左：选择插件 -->
  <div class="card list-card">
    <h2><span class="step">①</span><span data-i18n="step1"></span>
      <span class="spacer"></span>
      <button class="ghost mini" onclick="loadCatalog(true)" data-i18n="refresh"></button>
    </h2>
    <div class="list-toolbar">
      <input id="search" data-i18n-ph="searchPh" oninput="renderList(1)">
      <select id="sortBy" onchange="renderList(1)">
        <option value="downloads" data-i18n="sortDl"></option>
        <option value="name" data-i18n="sortName"></option>
      </select>
    </div>
    <p class="hint" style="margin:.0 0 .5rem" data-i18n="saveHint"></p>
    <div id="list" data-i18n="loadingCatalog"></div>
    <div class="pager">
      <button class="ghost mini" id="pgPrev" onclick="gotoPage(-1)" data-i18n="pgPrev"></button>
      <span class="pg" id="pgInfo"></span>
      <button class="ghost mini" id="pgNext" onclick="gotoPage(1)" data-i18n="pgNext"></button>
    </div>
    <div class="sticky-bar">
      <span class="count" id="selCount"></span>
      <button class="ghost mini" id="restoreBtn" style="display:none" onclick="restoreSelection()"></button>
      <button class="ghost mini" onclick="clearSelection()" data-i18n="clear"></button>
      <span class="spacer"></span>
      <button onclick="openConfirm()" data-i18n="startBtn"></button>
    </div>
  </div>

  <!-- 右：测试参数 -->
  <div class="card">
    <h2><span class="step">②</span><span data-i18n="step2"></span></h2>
    <label data-i18n="repoLabel"></label>
    <input id="repo" value="balugaq/sf-plugin-starting-tester">
    <label data-i18n="refLabel"></label>
    <input id="ref" value="master">
    <label data-i18n="verLabel"></label>
    <input id="ver" data-i18n-ph="verPh">
    <label data-i18n="platformLabel"></label>
    <select id="platform" onchange="loadMcVersions(true)">
      <option value="paper">paper</option><option value="purpur">purpur</option><option value="folia">folia</option>
    </select>
    <label data-i18n="mcLabel"></label>
    <div class="mcsel" id="mcSel">
      <input type="hidden" id="mcvers" value="26.2">
      <button type="button" class="mcsel-btn" id="mcToggle" onclick="toggleMcPanel()">
        <span id="mcBtnText"></span><span class="caret">▾</span>
      </button>
      <div class="mcsel-panel" id="mcPanel">
        <input type="text" id="mcSearch" data-i18n-ph="mcSearchPh" oninput="renderMcList()">
        <div id="mcList"></div>
        <div id="mcFallback" style="display:none">
          <input type="text" id="mcManual" data-i18n-ph="mcFallbackPh" oninput="document.getElementById('mcvers').value=this.value">
          <p class="hint" data-i18n="mcLoadFail"></p>
        </div>
      </div>
    </div>
    <label data-i18n="timeoutLabel"></label>
    <input id="timeout" value="900">
    <label data-i18n="jarsLabel"></label>
    <textarea id="extrajars" rows="3" data-i18n-ph="jarsPh"></textarea>
  </div>

</div>

<!-- 记录 -->
<div class="card">
  <h2><span class="step">③</span><span data-i18n="step3"></span>
    <span class="spacer"></span>
    <button class="ghost mini" onclick="loadResults()" data-i18n="refreshRec"></button>
  </h2>
  <p class="hint" style="margin-bottom:.6rem" data-i18n="recordsHint"></p>
  <table>
    <thead><tr><th class="col-time" data-i18n="colTime"></th><th class="col-run" data-i18n="colRun"></th><th class="col-status" data-i18n="colStatus"></th></tr></thead>
    <tbody id="results"><tr><td colspan="3" class="hint" data-i18n="waitResults"></td></tr></tbody>
  </table>
</div>

<!-- 确认弹窗 -->
<div class="mask" id="mask">
  <div class="dialog" id="confirm">
    <div class="head"><h2 data-i18n="confirmTitle"></h2></div>
    <div class="body" id="confirmBody"></div>
    <div class="actions">
      <div class="msg" id="goMsg"></div>
      <button class="ghost" onclick="document.getElementById('mask').classList.remove('show')" data-i18n="cancel"></button>
      <button class="btn-danger" id="goBtn" onclick="startBatch()" data-i18n="goBtn"></button>
    </div>
  </div>
</div>

<!-- 用户协议弹窗（首次开服时强制弹出） -->
<div class="mask" id="uaMask">
  <div class="dialog" id="ua">
    <div class="head"><h2 data-i18n="uaTitle"></h2></div>
    <div class="body">
      <p class="clause" data-i18n="uaIntro"></p>
      <p class="clause" data-i18n="uaClause1"></p>
      <p class="clause" data-i18n-html="uaClause2"></p>
    </div>
    <div class="actions" id="uaActions">
      <label class="ua-check"><input type="checkbox" id="uaCheck"> <span data-i18n="uaCheck"></span></label>
      <button class="ghost ua-cancel" id="uaCancel" onclick="closeUA()" data-i18n="cancel"></button>
      <button id="uaBtn" onclick="acceptUA()" data-i18n="uaAgree"></button>
    </div>
  </div>
</div>

<!-- 页脚：用户协议入口 -->
<footer class="site"><a href="#" onclick="showUA();return false" data-i18n="uaTitle"></a></footer>

<script src="i18n.js"></script>
<script>
const GH = 'https://api.github.com';
const SITE = 'https://resources.guizhanss.com/api/v1';
const FILL = 'https://fill.papermc.io/v3';
const WF = 'test-compatibility.yml';
const ICO_DL = '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06L8 10.81 3.97 6.78a.75.75 0 0 1 1.06-1.06l2.22 2.22V1.75A.75.75 0 0 1 8 1zm-6.5 11.25a.75.75 0 0 1 .75-.75h11.5a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1-.75-.75z"/></svg>';
const $ = id => document.getElementById(id);

/* ---------- i18n 函数（字典在 i18n.js；它加载失败时兜底显示 key，不让整页变白） ---------- */
function t(key, vars) {
  const lang = localStorage.getItem('gz_lang') || 'zh-CN';
  const dict = (window.I18N && (window.I18N[lang] || window.I18N['zh-CN'])) || {};
  let s = dict[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}
function applyI18n() {
  const lang = localStorage.getItem('gz_lang') || 'zh-CN';
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const btn = $('btnLang');
  if (btn) btn.textContent = t('langBtn');
}
if (!window.I18N) window.I18N = {};

/* ---------- 主题（日间/夜间）与语言 ---------- */
function setTheme(mode) {
  document.body.classList.toggle('light', mode === 'light');
  localStorage.setItem('gz_theme', mode);
  $('btnDark').classList.toggle('active', mode !== 'light');
  $('btnLight').classList.toggle('active', mode === 'light');
}
function toggleLang() {
  localStorage.setItem('gz_lang', (localStorage.getItem('gz_lang') || 'zh-CN') === 'zh-CN' ? 'en' : 'zh-CN');
  applyI18n();
  renderList(); renderMcList(); updateMcBtn(); maybeShowRestore();
}
setTheme(localStorage.getItem('gz_theme') || 'dark');

/* ---------- 本地记忆 ---------- */
$('token').value = localStorage.getItem('gh_pat') || '';
$('gzToken').value = localStorage.getItem('gz_token') || '';
$('ref').value = localStorage.getItem('gh_ref') || 'master';
$('repo').value = $('repo').value || guessRepo() || 'balugaq/sf-plugin-starting-tester';
applyI18n();

$('gzToken').addEventListener('change', () => {
  localStorage.setItem('gz_token', $('gzToken').value.trim());
});
$('ref').addEventListener('change', () => {
  localStorage.setItem('gh_ref', $('ref').value.trim());
});

function guessRepo() {
  const p = location.pathname.split('/').filter(Boolean);
  return p.length >= 2 ? p.slice(0, 2).join('/') : '';
}
function repoPath() {
  const r = $('repo').value.trim() || guessRepo();
  if (!r || !r.includes('/')) throw new Error(t('invalidRepo'));
  return r;
}
function ghHeaders() {
  const t2 = $('token').value.trim();
  if (!t2) throw new Error(t('needGhToken'));
  localStorage.setItem('gh_pat', t2);
  return { Authorization: `Bearer ${t2}`, Accept: 'application/vnd.github+json' };
}
/* 鬼斩资源站请求头：填了 Token 就带上（提高速率限制），没填就匿名 */
function gzHeaders(extra) {
  const h = Object.assign({}, extra);
  const t2 = $('gzToken').value.trim();
  if (t2) h['Authorization'] = `Bearer ${t2}`;
  return h;
}

/* ---------- ① 插件目录 ---------- */
let CATALOG = null;
const sel = new Set();

async function loadCatalog(force) {
  const cached = CATALOG && !force && (Date.now() - CATALOG.fetchedAt < 3600e3);
  if (cached) { renderList(); return; }
  $('list').innerHTML = `<span class="hint">${esc(t('loading'))}</span>`;
  try {
    const first = await (await fetch(`${SITE}/projects?page_size=50&page=1`, { headers: gzHeaders() })).json();
    const total = first.pagination?.total_items ?? first.data.length;
    const items = [...first.data];
    for (let p = 2; p <= Math.ceil(total / 50); p++) {
      const d = await (await fetch(`${SITE}/projects?page_size=50&page=${p}`, { headers: gzHeaders() })).json();
      items.push(...d.data);
    }
    CATALOG = { fetchedAt: Date.now(), items };
    localStorage.setItem('catalog', JSON.stringify(CATALOG));
    renderList();
  } catch (e) {
    $('list').innerHTML = `<span class="err">${esc(t('loadFail', { m: e.message }))}</span>`;
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hi(text, q) {
  const t2 = esc(text || '');
  if (!q) return t2;
  try {
    return t2.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>');
  } catch { return t2; }
}

/* ---------- 排序与翻页（一页最多 5 个，排序偏好记忆在 gz_sort） ---------- */
const PER_PAGE = 5;
let PAGE = 1;
function currentSort() {
  return $('sortBy')?.value || localStorage.getItem('gz_sort') || 'downloads';
}
function gotoPage(delta) {
  PAGE = Math.max(1, PAGE + delta);
  renderList();
  $('list').scrollTop = 0;
}
function renderList(resetPage) {
  if (resetPage === 1) PAGE = 1;
  const sort = currentSort();
  if ($('sortBy')) $('sortBy').value = sort;
  localStorage.setItem('gz_sort', sort);
  const q = $('search')?.value.trim().toLowerCase() || '';
  const all = CATALOG?.items || [];
  // 搜索优先级：名称/slug 匹配在前，简介匹配在后（各自保持原排序）
  let items = all.filter(p =>
    !q || p.name?.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q));
  if (q) items = items.concat(all.filter(p =>
    !(p.name?.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q))
    && p.summary?.toLowerCase().includes(q)));
  if (sort === 'name') {
    items.sort((a, b) => String(a.name || a.slug).localeCompare(String(b.name || b.slug), undefined, { sensitivity: 'base' }));
  } else {
    items.sort((a, b) => (b.downloads ?? 0) - (a.downloads ?? 0));
  }
  const el = $('list');
  $('selCount').textContent = t('selCount', { n: sel.size });
  if (!items.length) {
    el.innerHTML = `<span class="hint">${esc(t('noMatch'))}</span>`;
    $('pgInfo').textContent = t('pgInfo', { p: 1, n: 1 });
    $('pgPrev').disabled = $('pgNext').disabled = true;
    return;
  }
  const pages = Math.max(1, Math.ceil(items.length / PER_PAGE));
  PAGE = Math.min(PAGE, pages);
  items = items.slice((PAGE - 1) * PER_PAGE, PAGE * PER_PAGE);
  el.innerHTML = items.map(p => {
    const st = conflictState(p.slug);
    const blocked = st && st.blockedBy;
    return `
    <label class="item ${sel.has(p.slug) ? 'selected' : ''}">
      <input type="checkbox" ${sel.has(p.slug) ? 'checked' : ''} ${blocked ? 'disabled' : ''} onchange="toggleSel('${p.slug}', this.checked)">
      <div class="body">
        <div class="name"><b>${hi(p.name || p.slug, q)}</b> <span class="meta">@${esc(p.slug)} · ${ICO_DL}${p.downloads ?? 0}</span></div>
        <div class="meta">${hi((p.summary || '').slice(0, 90), q)}${blocked ? ` <span class="conflict-note">${esc(t('conflictWith', { s: st.blockedBy }))}</span>` : ''}</div>
      </div>
      ${blocked ? `<button class="conflict-btn" title="${esc(st.reason)}" onclick="event.preventDefault();unselectSlug('${st.blockedBy}')">${esc(t('conflictBtn', { s: st.blockedBy }))}</button>` : ''}
    </label>`;
  }).join('');
  $('pgInfo').textContent = t('pgInfo', { p: PAGE, n: pages });
  $('pgPrev').disabled = PAGE <= 1;
  $('pgNext').disabled = PAGE >= pages;
}
function saveSelection() { localStorage.setItem('gz_selection', JSON.stringify([...sel])); }
function toggleSel(slug, on) {
  if (on) {
    // 冲突守卫：包含关系二选一，对面已选就不允许再选
    const st = conflictState(slug);
    if (st && st.blockedBy) return;
  }
  on ? sel.add(slug) : sel.delete(slug);
  saveSelection();
  renderList();
}
function unselectSlug(slug) { sel.delete(slug); saveSelection(); renderList(); }
function clearSelection() { sel.clear(); saveSelection(); renderList(); }

/* ---------- 冲突规则（pages/conflicts.json）：contains 已包含 included，二者二选一 ---------- */
let CONFLICTS = [];
fetch('conflicts.json').then(r => r.ok ? r.json() : { conflicts: [] })
  .then(d => { CONFLICTS = (d.conflicts || []).filter(r => r.contains && r.included); renderList(); })
  .catch(() => {});

const slugEq = (a, b) => a.toLowerCase() === b.toLowerCase();
/* 返回该 slug 的冲突状态：blockedBy=对面已选，本项被禁；blocks=本项已选，禁了对面 */
function conflictState(slug) {
  for (const r of CONFLICTS) {
    let other = null;
    if (slugEq(slug, r.contains)) other = r.included;
    else if (slugEq(slug, r.included)) other = r.contains;
    if (!other) continue;
    const otherSel = [...sel].some(s => slugEq(s, other));
    const meSel = [...sel].some(s => slugEq(s, slug));
    if (otherSel && !meSel) return { blockedBy: other, reason: r.reason };
    if (meSel && !otherSel) return { blocks: other, reason: r.reason };
  }
  return null;
}

/* 上次选择的插件：本地有记录且当前未选任何东西时，提供一键恢复 */
function maybeShowRestore() {
  const saved = JSON.parse(localStorage.getItem('gz_selection') || '[]');
  const b = $('restoreBtn');
  if (saved.length && !sel.size) {
    b.style.display = '';
    b.textContent = t('restore', { n: saved.length });
  } else { b.style.display = 'none'; }
}
function restoreSelection() {
  const saved = JSON.parse(localStorage.getItem('gz_selection') || '[]');
  saved.forEach(s => sel.add(s));
  saveSelection();
  renderList();
  maybeShowRestore();
}

/* ---------- ② MC 版本多选下拉（版本列表来自 Paper REST API） ---------- */
let MCGROUPS = [];   // [{label, versions}]
const MCSEL = new Set(($('mcvers').value || '').split(',').map(s => s.trim()).filter(Boolean));

async function loadMcVersions(force) {
  const panel = $('mcList');
  if (MCGROUPS.length && !force) { renderMcList(); return; }
  panel.innerHTML = `<span class="hint">${esc(t('mcLoading'))}</span>`;
  const platform = $('platform').value;
  try {
    const d = await (await fetch(`${FILL}/projects/${platform}`)).json();
    const raw = d.versions || {};
    MCGROUPS = Object.entries(raw)
      .map(([label, versions]) => ({ label, versions }))
      .filter(g => g.versions.length);
    $('mcFallback').style.display = 'none';
    $('mcSearch').style.display = '';
    renderMcList();
  } catch {
    // API 挂了就降级成手动输入，不卡住用户
    $('mcSearch').style.display = 'none';
    $('mcFallback').style.display = '';
    panel.innerHTML = '';
  }
}
function renderMcList() {
  if (!MCGROUPS.length) return;
  const q = $('mcSearch').value.trim().toLowerCase();
  $('mcList').innerHTML = MCGROUPS.map(g => {
    const vers = g.versions.filter(v => !q || v.toLowerCase().includes(q));
    if (!vers.length) return '';
    return `<div class="grp">${esc(g.label)}</div>` + vers.map(v => `
      <label class="opt"><input type="checkbox" ${MCSEL.has(v) ? 'checked' : ''} onchange="toggleMcVer('${v}', this.checked)">
        ${hi(v, q)}</label>`).join('');
  }).join('') || `<span class="hint">${esc(t('noMatch'))}</span>`;
}
function toggleMcVer(v, on) { on ? MCSEL.add(v) : MCSEL.delete(v); syncMcValue(); renderMcList(); }
function syncMcValue() {
  $('mcvers').value = [...MCSEL].join(',');
  updateMcBtn();
}
function updateMcBtn() {
  const a = [...MCSEL];
  $('mcBtnText').textContent = a.length
    ? (a.length <= 3 ? a.join(', ') : `${a.slice(0, 3).join(', ')} +${a.length - 3}`)
    : t('mcNone');
}
function toggleMcPanel() {
  const open = $('mcSel').classList.toggle('open');
  if (open) loadMcVersions(false);
}
/* 点外面收起下拉 */
document.addEventListener('click', e => {
  if (!$('mcSel').contains(e.target)) $('mcSel').classList.remove('open');
});

/* ---------- 顶部 toast（点击开始测试等关键动作的即时反馈） ---------- */
let toastTimer;
function showToast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
  void el.offsetWidth;   // 重置过渡：连续弹时从透明重新进入
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ---------- ② 确认与触发 ---------- */
/* 当前测试矩阵（插件集合 + MC 版本集合 + 平台），用于重复测试提示 */
function currentMatrix() {
  return JSON.stringify({
    s: [...sel].map(s => s.toLowerCase()).sort(),
    m: ($('mcvers').value || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean).sort(),
    p: $('platform').value
  });
}
function openConfirm() {
  if (!sel.size) { alert(t('selNone')); return; }
  const mc = $('mcvers').value.trim();
  if (!mc) { alert(t('mcNone')); return; }
  const slugs = [...sel];
  const jars = $('extrajars').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
  // 与上次完全相同的矩阵：可能是误触，先确认
  const dup = localStorage.getItem('gz_last_matrix') === currentMatrix();
  $('confirmBody').innerHTML = `
    ${dup ? `<p class="warn">${esc(t('dupMatrix'))}</p>` : ''}
    <p>${t('confirmBody', { n: slugs.length, mc: esc(mc), pf: esc($('platform').value) })}</p>
    ${jars.length ? `<p class="hint">${esc(t('jarsNote', { n: jars.length }))}</p>` : ''}
    <ul>${slugs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <p class="hint">${esc(t('confirmHint', { t: esc($('timeout').value) }))}</p>`;
  $('goMsg').textContent = '';
  $('mask').classList.add('show');
  showToast(t('toastSelected', { n: slugs.length }));
}

/* 校验仓库与分支真实存在，返回确认后的分支名 */
async function validateTarget() {
  const repo = repoPath();
  const ref = $('ref').value.trim() || 'master';
  let res = await fetch(`${GH}/repos/${repo}`, { headers: ghHeaders() });
  if (res.status === 404) throw new Error(t('repoNotExist', { r: repo }));
  if (!res.ok) throw new Error(t('apiErr', { s: res.status, w: t('repoCheck') }));
  res = await fetch(`${GH}/repos/${repo}/branches/${encodeURIComponent(ref)}`, { headers: ghHeaders() });
  if (res.status === 404) throw new Error(t('branchNotExist', { b: ref, r: repo }));
  if (!res.ok) throw new Error(t('apiErr', { s: res.status, w: t('branchCheck') }));
  return ref;
}

async function startBatch() {
  const go = $('goMsg'), btn = $('goBtn');
  btn.disabled = true;
  try {
    // 双 Token 必填：GitHub Token 触发 workflow，鬼斩 Token 请求资源站
    if (!$('token').value.trim()) throw new Error(t('needGhToken'));
    if (!$('gzToken').value.trim()) throw new Error(t('needGzToken'));
    // 超时范围：最长 2 小时
    const to = parseInt($('timeout').value, 10);
    if (!Number.isFinite(to) || String(to) !== $('timeout').value.trim() || to < 1 || to > 7200)
      throw new Error(t('timeoutRange'));
    // 仓库 / 分支存在性校验
    const ref = await validateTarget();
    localStorage.setItem('gh_ref', ref);
    // 首次开服：先弹用户协议
    if (!localStorage.getItem('ua_accepted')) {
      $('uaCheck').checked = false;
      $('mask').classList.remove('show');
      $('uaMask').classList.add('show');
      return;
    }
    await doDispatch(ref);
  } catch (e) {
    go.textContent = t('errPrefix', { m: e.message }); go.className = 'msg err';
  } finally { btn.disabled = false; }
}

async function doDispatch(ref) {
  const go = $('goMsg'), btn = $('goBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`${GH}/repos/${repoPath()}/actions/workflows/${WF}/dispatches`, {
      method: 'POST', headers: ghHeaders(),
      body: JSON.stringify({
        ref,
        inputs: {
          plugin_slugs: [...sel].join(','),
          plugin_version: $('ver').value.trim(),
          minecraft_versions: $('mcvers').value.trim(),
          platform: $('platform').value,
          extra_jars: $('extrajars').value.split(/\n+/).map(s => s.trim()).filter(Boolean).join(','),
          start_timeout: String(parseInt($('timeout').value, 10) || 900),
        }
      })
    });
    if (res.status !== 204) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
    localStorage.setItem('gz_last_matrix', currentMatrix());
    $('mask').classList.remove('show');
    showToast(t('triggered'));
    loadResults();
  } catch (e) {
    go.textContent = t('dispatchFail', { m: e.message }); go.className = 'msg err';
  } finally { btn.disabled = false; }
}

function acceptUA() {
  if (!$('uaCheck').checked) { alert(t('uaAlert')); return; }
  localStorage.setItem('ua_accepted', '1');
  $('uaMask').classList.remove('show');
  $('goMsg').textContent = '';
  startBatch();
}
/* 页脚「用户协议」：纯查看模式（无勾选、无同意按钮） */
function showUA() {
  $('uaActions').classList.add('ua-only-actions');
  $('uaCancel').textContent = t('uaClose');
  $('uaMask').classList.add('show');
}
function closeUA() {
  $('uaMask').classList.remove('show');
  $('uaActions').classList.remove('ua-only-actions');
}

/* ---------- ③ 测试记录 ---------- */
/* results.json 由最近一次测试随 Pages 部署，用于把「流程成功但有插件失败」标成部分完成 */
async function loadResultsSummary() {
  const [owner, name] = repoPath().split('/');
  try {
    const res = await fetch(`https://${owner}.github.io/${name}/results.json?_=${Date.now()}`);
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function loadResults() {
  const tbody = $('results');
  try {
    const res = await fetch(`${GH}/repos/${repoPath()}/actions/workflows/${WF}/runs?per_page=15`, { headers: ghHeaders() });
    if (!res.ok) throw new Error(t('apiErr', { s: res.status, w: t('repoCheck') }));
    const runs = (await res.json()).workflow_runs;
    const latestDone = runs.find(r => r.status === 'completed');
    // 只有最近一次成功运行的报告部署在 Pages，只有它做部分完成判定
    let SUM = null;
    if (latestDone && latestDone.conclusion === 'success') SUM = await loadResultsSummary();
    let html = '';
    for (const r of runs) {
      let badge;
      if (r.status !== 'completed') {
        badge = `<span class="badge ${r.status === 'queued' ? 'queue' : 'run'}">${esc(t(r.status === 'queued' ? 'badgeQueue' : 'badgeRun'))}</span>`;
      } else if (r.conclusion !== 'success') {
        badge = `<span class="badge fail">${esc(t('badgeFail'))}</span>`;
      } else if (r === latestDone && SUM && SUM.total > 0 && SUM.passed < SUM.total) {
        badge = `<span class="badge partial">${esc(t('badgePartial', { p: SUM.passed, t: SUM.total }))}</span>`;
      } else if (r === latestDone && SUM && SUM.total > 0) {
        badge = `<span class="badge ok">${esc(t('badgeAll', { p: SUM.passed, t: SUM.total }))}</span>`;
      } else {
        badge = `<span class="badge ok">${esc(t('badgeDone'))}</span>`;
      }
      html += `<tr>
        <td class="col-time">${new Date(r.created_at).toLocaleString('zh-CN', { hour12: false })}</td>
        <td class="col-run">#${r.run_number}</td>
        <td class="col-status">${badge}<a href="${r.html_url}" target="_blank">${esc(t('logs'))}</a></td>
      </tr>`;
    }
    tbody.innerHTML = html || `<tr><td colspan="3" class="hint">${esc(t('noRuns'))}</td></tr>`;
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="3" class="err">${esc(e.message)}</td></tr>`;
  }
  clearTimeout(loadResults._t);
  loadResults._t = setTimeout(loadResults, 20000);
}

if ($('token').value.trim()) { loadCatalog(); loadResults(); }
maybeShowRestore();
updateMcBtn();
loadMcVersions(false);
</script>
