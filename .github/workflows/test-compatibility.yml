name: Plugin Compatibility Test

# 手动触发：从鬼斩资源站下载指定插件（自动装硬依赖），
# 在多个 MC 版本上开服测试能否正常启用，汇总生成 HTML 报告。
on:
  workflow_dispatch:
    inputs:
      plugin_slugs:
        description: "资源站项目 slug，逗号分隔多个（一次开服全部测试）"
        required: true
      plugin_version:
        description: "版本号（留空 = 最新 release）"
        required: false
        default: ""
      softdepend_plugins:
        description: "额外安装的 softdepend 插件名，逗号分隔（GuizhanLibPlugin 始终安装）"
        required: false
        default: ""
      extra_jars:
        description: "自备 jar 下载直链，逗号分隔（替代/补充 extra-plugins/ 目录）"
        required: false
        default: ""
      minecraft_versions:
        description: "要测试的 MC 版本，逗号分隔"
        required: true
        default: "1.21.4,1.20.6,1.20.4"
      platform:
        description: "服务端平台（paper / purpur / folia）"
        required: false
        default: "paper"
      start_timeout:
        description: "单次开服超时秒数"
        required: false
        default: "600"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 表达式层没有 split/replace，逗号串转数组只能在 shell 里算好传出
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          MCV: ${{ inputs.minecraft_versions }}
        run: |
          matrix=$(echo "$MCV" | jq -R -c 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))')
          [ -n "$matrix" ] && [ "$matrix" != "[]" ] || matrix='["latest"]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # 解析 + 下载只做一次：jar 与 manifest 打包成 artifact 供所有版本复用，
  # 资源站 jar 跨运行缓存也只挂在这个 job 上
  resolve:
    name: 解析与下载插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 缓存资源站 jar
        uses: actions/cache@v6
        with:
          path: .gzcache
          key: gz-jars-v1

      - name: 下载自备 jar
        if: inputs.extra_jars != ''
        run: |
          mkdir -p plugins
          IFS=',' read -ra URLS <<< "${{ inputs.extra_jars }}"
          for u in "${URLS[@]}"; do
            [ -z "$u" ] && continue
            curl -sfL -o "plugins/$(basename "${u%%\?*}")" "$u"
          done

      - name: 下载插件与依赖
        env:
          GUIZHAN_TOKEN: ${{ secrets.GUIZHAN_TOKEN }}
          PLUGIN_SLUGS: ${{ inputs.plugin_slugs }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          SOFTDEPEND_INSTALL: ${{ inputs.softdepend_plugins }}
        run: bash scripts/resolve-plugin.sh "$PLUGIN_SLUGS" "$PLUGIN_VERSION"

      - name: 上传插件包（jar + manifest，供各版本测试复用）
        uses: actions/upload-artifact@v7
        with:
          name: plugins-batch
          path: |
            plugins/*.jar
            plugins/manifest.json

  test:
    name: "MC ${{ matrix.mcver }}"
    runs-on: ubuntu-latest
    needs: [setup, resolve]
    strategy:
      fail-fast: false
      matrix:
        mcver: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: 取复用的插件包
        uses: actions/download-artifact@v8
        with:
          name: plugins-batch
          path: plugins

      # 过期策略：GitHub 对「整个条目 7 天无访问」自动驱逐；条目内单文件的
      # 7/14 天过期由脚本按文件 mtime 清理（gz 7 天 / server 14 天）。
      - name: 缓存服务端 jar
        uses: actions/cache@v6
        with:
          path: .paper-cache
          key: server-${{ inputs.platform }}-${{ matrix.mcver }}-v1

      # 主力 Java 25；另装 21（MC ≤ 1.19.1，旧版 ASM 不支持 25）与 17
      # （MC ≤ 1.18.1，服务端不支持 21+），分级判断在 run-server.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 开服测试
        env:
          START_TIMEOUT: ${{ inputs.start_timeout }}
        run: bash scripts/run-server.sh "${{ matrix.mcver }}" "${{ inputs.platform }}"

      - name: 打包结果与日志
        if: always()
        run: |
          mkdir -p results
          mv result-*.json results/ 2>/dev/null || true
          cp console.log "results/console-${{ matrix.mcver }}.log" 2>/dev/null || true

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t-batch-${{ matrix.mcver }}
          path: results/

  report:
    name: 汇总报告
    runs-on: ubuntu-latest
    needs: test
    if: always()
    # 只让部署阶段与 Deploy Pages 排队；放顶层会把整个测试矩阵一起堵住
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 收集各版本结果
        uses: actions/download-artifact@v8
        with:
          pattern: t-*
          path: artifacts/

      - name: 合并结果文件
        run: |
          mkdir -p results
          find artifacts -name "result-*.json" -exec cp {} results/ \;
          find artifacts -name "console-*.log" -exec cp {} . \;

      - name: 生成 HTML 报告
        run: python3 scripts/build-report.py

      # 多版本结果汇总表（md + csv），随 artifact 一起提供
      - name: 生成汇总表格
        env:
          # 被 cancel 的版本不会写出结果文件，传入期望版本让表格保留该列并标为无数据
          EXPECTED_VERSIONS: ${{ inputs.minecraft_versions }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/build-summary.py

      - name: 上传报告（artifact）
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: |
            report.html
            summary.md
            summary.csv
            console-*.log

      - name: 组装站点（控制台 + 最新报告）
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp pages/i18n.js _site/i18n.js
          cp pages/conflicts.json _site/conflicts.json
          cp report.html _site/report.html
          cp results.json _site/results.json 2>/dev/null || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5
