name: Deploy Pages

# push 到 master 时自动部署控制台页面（pages/index.html）到 GitHub Pages，
# 无需手动触发即可在 Pages 链接看到最新版本。
# 测试完成后由 test-compatibility.yml 的 report job 覆盖部署（控制台 + 最新报告）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 重跑失败 run 时清理残留的 github-pages artifact 需要 actions: write
  actions: write

# 同名 Pages 部署并发会冲突，排队处理
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署控制台
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # 首次部署成功时重试步骤是跳过的，输出为空，回退到首次尝试的 page_url
      url: ${{ steps.deploy-first.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 组装站点
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp pages/i18n.js _site/i18n.js
          cp pages/conflicts.json _site/conflicts.json
          # 仓库根目录若存有报告产物则一并带上，避免本次部署把线上已有报告冲掉
          [ -f report.html ] && cp report.html _site/report.html || true
          [ -f results.json ] && cp results.json _site/results.json || true

      # 重跑失败 run 时旧的 github-pages artifact 会残留，deploy-pages 因发现
      # 多个同名 artifact 而拒绝部署，先清掉
      - name: 清理残留 Pages 产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[] | select(.name == "github-pages") | .id') || true
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # 默认只留 1 天：隔天仅重跑 deploy job 会因产物过期报「找不到 github-pages」
          retention-days: 7

      # deploy-pages 查产物只调一次 Results 服务，服务端索引偶发滞后就会误报
      # 「No artifacts named github-pages」（上游 actions/deploy-pages#418）。
      # 先在 REST 侧确认产物已可读，把误判窗口尽量缩短。
      - name: 等待 Pages 产物可见
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 18); do
            n=$(gh api --paginate \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              -q '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null | wc -l)
            if [ "${n:-0}" -ge 1 ]; then
              echo "github-pages 产物已可见（第 ${i} 次探测）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::90 秒内仍未在本次 run 的产物列表里看到 github-pages"
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            -q '.artifacts[].name' || true
          exit 1

      # 只重试部署，不重传产物：重传会造出第二个同名 artifact，deploy-pages
      # 会改以「Multiple artifacts named github-pages」拒绝部署
      - name: 部署 Pages（首次）
        id: deploy-first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: 等待产物索引稳定
        if: steps.deploy-first.outcome == 'failure'
        run: sleep 20

      - name: 部署 Pages（重试）
        id: deployment
        if: steps.deploy-first.outcome == 'failure'
        uses: actions/deploy-pages@v5
