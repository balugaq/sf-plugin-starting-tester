name: Deploy Pages

# push 到 master 时自动部署控制台页面（pages/index.html）到 GitHub Pages，
# 无需手动触发即可在 Pages 链接看到最新版本。
# 测试完成后由 test-compatibility.yml 的 report job 覆盖部署（控制台 + 最新报告）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同名 Pages 部署并发会冲突，排队处理
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署控制台
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 组装站点
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp pages/i18n.js _site/i18n.js
          cp pages/conflicts.json _site/conflicts.json
          # 仓库根目录若存有报告产物则一并带上，避免本次部署把线上已有报告冲掉
          [ -f report.html ] && cp report.html _site/report.html || true
          [ -f results.json ] && cp results.json _site/results.json || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5
